<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --fg: #f2f2f2;
            --accent: #ff3333; /* Swiss Red */
            --border: #333;
            --panel-bg: #111;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --spacing: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            font-size: 13px;
        }

        /* --- LAYOUT --- */
        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            width: 100%;
            height: 100%;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            height: 100%;
            padding: 0;
        }

        .brand {
            padding: 24px var(--spacing);
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand h1 {
            font-weight: 900;
            font-size: 24px;
            letter-spacing: -1px;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand span {
            color: var(--accent);
        }

        .controls-wrapper {
            padding: var(--spacing);
        }

        .control-group {
            margin-bottom: 32px;
        }

        .group-header {
            text-transform: uppercase;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .group-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* --- INPUTS --- */
        .control-row {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .control-row label {
            font-size: 11px;
            margin-bottom: 6px;
            color: #ccc;
            display: flex;
            justify-content: space-between;
        }

        .value-readout {
            color: var(--accent);
            font-family: var(--font-mono);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            background: var(--fg);
            cursor: pointer;
            border-radius: 0; /* Square thumb */
            margin-top: -5px;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: var(--border);
        }

        select {
            width: 100%;
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--border);
            padding: 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            cursor: pointer;
            outline: none;
            border-radius: 0;
            appearance: none;
        }

        select:hover {
            border-color: #666;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #222;
        }

        .checkbox-row label {
            margin: 0;
            cursor: pointer;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            cursor: pointer;
            position: relative;
        }

        input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        input[type="file"] {
            font-family: var(--font-mono);
            font-size: 10px;
            color: #888;
        }

        input[type="file"]::file-selector-button {
            background: var(--fg);
            color: var(--bg);
            border: none;
            padding: 6px 12px;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
            margin-right: 10px;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 24px;
            background: none;
            cursor: pointer;
        }
        
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border);
        }

        .btn {
            background: var(--fg);
            color: var(--bg);
            border: none;
            padding: 10px;
            width: 100%;
            font-family: var(--font-main);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            background: #fff;
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg);
        }

        .btn.secondary:hover {
            border-color: var(--fg);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 24px;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            background: var(--bg);
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* The container for the ASCII art */
        #ascii-wrapper {
            background: var(--bg); /* This will be dynamic */
            padding: 0;
            box-shadow: 0 0 0 1px #222;
            transition: transform 0.1s;
        }

        #ascii-art {
            font-family: var(--font-mono);
            white-space: pre;
            line-height: 1;
            margin: 0;
            cursor: crosshair;
            user-select: text;
        }

        /* Helper for colored ASCII */
        #ascii-art span {
            display: inline-block;
        }

        /* Floating Info */
        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: #444;
            pointer-events: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            .sidebar {
                height: auto;
                max-height: 300px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .brand {
                position: relative;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="brand">
            <h1>ASCII<span>ART</span></h1>
        </div>

        <div class="controls-wrapper">
            <!-- FILE INPUT -->
            <div class="control-group">
                <div class="group-header">01 Input</div>
                <div class="control-row">
                    <input type="file" id="upload" accept="image/*">
                </div>
            </div>

            <!-- DIMENSIONS & FONT -->
            <div class="control-group">
                <div class="group-header">02 Typography</div>
                
                <div class="control-row">
                    <label>Scale / Density <span class="value-readout" id="asciiWidthVal">120</span></label>
                    <input type="range" id="asciiWidth" min="20" max="300" value="120">
                </div>

                <div class="control-row">
                    <label>Font Weight <span class="value-readout" id="fontWeightVal">400</span></label>
                    <input type="range" id="fontWeight" min="100" max="900" step="100" value="400">
                </div>

                <div class="control-row">
                    <label>Letter Spacing <span class="value-readout" id="letterSpacingVal">0</span></label>
                    <input type="range" id="letterSpacing" min="-2" max="6" step="0.5" value="0">
                </div>

                <div class="control-row">
                    <label>Line Height <span class="value-readout" id="lineHeightVal">1.0</span></label>
                    <input type="range" id="lineHeight" min="0.5" max="2.0" step="0.05" value="1.0">
                </div>

                <div class="control-row">
                    <label>Zoom Preview <span class="value-readout" id="zoomVal">100%</span></label>
                    <input type="range" id="zoom" min="10" max="200" value="100">
                </div>
            </div>

            <!-- APPEARANCE & COLOR -->
            <div class="control-group">
                <div class="group-header">03 Appearance</div>
                
                <div class="control-row">
                    <label>Color Mode</label>
                    <select id="colorMode">
                        <option value="mono" selected>Monochrome (Fast)</option>
                        <option value="image">Original Colors</option>
                        <option value="custom">Custom Color</option>
                    </select>
                </div>

                <div class="control-row" id="customColorControl" style="display:none;">
                    <label>Text Color</label>
                    <input type="color" id="customColorPicker" value="#ffffff">
                </div>

                <div class="control-row">
                    <label>Background Color</label>
                    <input type="color" id="bgColorPicker" value="#080808">
                </div>

                <div class="checkbox-row">
                    <label for="invert">Invert Source</label>
                    <input type="checkbox" id="invert">
                </div>
                 <div class="checkbox-row">
                    <label for="ignoreWhite">Transparent Background</label>
                    <input type="checkbox" id="ignoreWhite" checked>
                </div>
            </div>

            <!-- IMAGE PROCESSING -->
            <div class="control-group">
                <div class="group-header">04 Processing</div>
                
                <div class="control-row">
                    <label>Brightness <span class="value-readout" id="brightnessVal">0</span></label>
                    <input type="range" id="brightness" min="-100" max="100" value="0">
                </div>

                <div class="control-row">
                    <label>Contrast <span class="value-readout" id="contrastVal">0</span></label>
                    <input type="range" id="contrast" min="-100" max="100" value="0">
                </div>

                <div class="control-row">
                    <label>Charset</label>
                    <select id="charset">
                        <option value="detailed" selected>Detailed</option>
                        <option value="standard">Standard</option>
                        <option value="blocks">Blocks</option>
                        <option value="binary">Binary</option>
                        <option value="minimal">Minimal</option>
                    </select>
                </div>
            </div>

            <!-- DITHERING -->
             <div class="control-group">
                <div class="group-header">05 Dithering</div>
                <div class="checkbox-row">
                    <label for="dithering">Enable Dithering</label>
                    <input type="checkbox" id="dithering" checked>
                </div>
                <div class="control-row">
                    <label>Algorithm</label>
                    <select id="ditherAlgorithm">
                        <option value="floyd" selected>Floyd–Steinberg</option>
                        <option value="atkinson">Atkinson</option>
                        <option value="noise">Noise</option>
                    </select>
                </div>
            </div>

            <!-- EDGE DETECTION -->
            <div class="control-group">
                <div class="group-header">06 Edge Detection</div>
                <div class="control-row">
                    <select id="edgeMethod">
                        <option value="none" selected>None</option>
                        <option value="sobel">Sobel Operator</option>
                        <option value="dog">Diff. of Gaussians</option>
                    </select>
                </div>
                <div class="control-row" id="thresholdControl" style="display:none;">
                    <label>Threshold <span class="value-readout" id="thresholdVal">100</span></label>
                    <input type="range" id="edgeThreshold" min="0" max="255" value="100">
                </div>
            </div>

            <div class="actions">
                <button class="btn secondary" id="resetBtn">Reset</button>
                <button class="btn secondary" id="copyBtn">Copy Text</button>
                <button class="btn" id="downloadBtn" style="grid-column: span 2;">Download PNG</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div id="ascii-wrapper">
            <pre id="ascii-art"></pre>
        </div>
        <div class="info-panel">
            RENDER: <span id="renderTime">0</span>ms
        </div>
    </main>
</div>

<!-- Hidden Canvas for processing -->
<canvas id="canvas" style="display: none;"></canvas>

<script>
    // ---------------- Global Variables ----------------
    let currentImage = null;
    const baseFontSize = 10;
    
    // Store render data for export
    let renderedColors = []; // Array of {r,g,b} objects
    let renderedWidth = 0;
    
    // ---------------- Helper Functions ----------------
    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    // Gaussian Kernel for DoG
    function gaussianKernel2D(sigma, kernelSize) {
        const kernel = [];
        const half = Math.floor(kernelSize / 2);
        let sum = 0;
        for (let y = -half; y <= half; y++) {
            const row = [];
            for (let x = -half; x <= half; x++) {
                const value = Math.exp(-(x * x + y * y) / (2 * sigma * sigma));
                row.push(value);
                sum += value;
            }
            kernel.push(row);
        }
        for (let y = 0; y < kernelSize; y++) {
            for (let x = 0; x < kernelSize; x++) {
                kernel[y][x] /= sum;
            }
        }
        return kernel;
    }

    function convolve2D(img, kernel) {
        const height = img.length, width = img[0].length;
        const kernelSize = kernel.length, half = Math.floor(kernelSize / 2);
        const output = [];
        for (let y = 0; y < height; y++) {
            output[y] = [];
            for (let x = 0; x < width; x++) {
                let sum = 0;
                for (let ky = 0; ky < kernelSize; ky++) {
                    for (let kx = 0; kx < kernelSize; kx++) {
                        const yy = y + ky - half;
                        const xx = x + kx - half;
                        let pixel = (yy >= 0 && yy < height && xx >= 0 && xx < width) ? img[yy][xx] : 0;
                        sum += pixel * kernel[ky][kx];
                    }
                }
                output[y][x] = sum;
            }
        }
        return output;
    }

    function differenceOfGaussians2D(gray, sigma1, sigma2, kernelSize) {
        const kernel1 = gaussianKernel2D(sigma1, kernelSize);
        const kernel2 = gaussianKernel2D(sigma2, kernelSize);
        const blurred1 = convolve2D(gray, kernel1);
        const blurred2 = convolve2D(gray, kernel2);
        const height = gray.length, width = gray[0].length;
        const dog = [];
        for (let y = 0; y < height; y++) {
            dog[y] = [];
            for (let x = 0; x < width; x++) {
                dog[y][x] = blurred1[y][x] - blurred2[y][x];
            }
        }
        return dog;
    }

    // Sobel Operator
    function applySobel2D(img, width, height) {
        const mag = [], angle = [];
        const kernelX = [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]];
        const kernelY = [[-1, -2, -1], [0, 0, 0], [1, 2, 1]];
        
        // Init arrays
        for(let y=0; y<height; y++) { mag[y] = new Array(width).fill(0); angle[y] = new Array(width).fill(0); }

        for (let y = 1; y < height - 1; y++) {
            for (let x = 1; x < width - 1; x++) {
                let Gx = 0, Gy = 0;
                for (let ky = -1; ky <= 1; ky++) {
                    for (let kx = -1; kx <= 1; kx++) {
                        const pixel = img[y + ky][x + kx];
                        Gx += pixel * kernelX[ky + 1][kx + 1];
                        Gy += pixel * kernelY[ky + 1][kx + 1];
                    }
                }
                mag[y][x] = Math.sqrt(Gx * Gx + Gy * Gy);
                let theta = Math.atan2(Gy, Gx) * (180 / Math.PI);
                if (theta < 0) theta += 180;
                angle[y][x] = theta;
            }
        }
        return { mag, angle };
    }

    function nonMaxSuppression(mag, angle, width, height) {
        const suppressed = [];
        for (let y = 0; y < height; y++) suppressed[y] = new Array(width).fill(0);
        
        for (let y = 1; y < height - 1; y++) {
            for (let x = 1; x < width - 1; x++) {
                const q = 255;
                const r = 255;
                const theta = angle[y][x];
                let val1 = 0, val2 = 0;
                
                // Angle quantization
                if ((theta >= 0 && theta < 22.5) || (theta >= 157.5 && theta <= 180)) {
                    val1 = mag[y][x-1]; val2 = mag[y][x+1];
                } else if (theta >= 22.5 && theta < 67.5) {
                    val1 = mag[y-1][x+1]; val2 = mag[y+1][x-1];
                } else if (theta >= 67.5 && theta < 112.5) {
                    val1 = mag[y-1][x]; val2 = mag[y+1][x];
                } else if (theta >= 112.5 && theta < 157.5) {
                    val1 = mag[y-1][x-1]; val2 = mag[y+1][x+1];
                }

                if (mag[y][x] >= val1 && mag[y][x] >= val2) {
                    suppressed[y][x] = mag[y][x];
                } else {
                    suppressed[y][x] = 0;
                }
            }
        }
        return suppressed;
    }

    // ---------------- Main Generation ----------------
    function generateASCII(img) {
        const startTime = performance.now();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const outputPre = document.getElementById('ascii-art');
        
        // Params
        const asciiWidth = parseInt(document.getElementById('asciiWidth').value, 10);
        const brightness = parseFloat(document.getElementById('brightness').value);
        const contrastValue = parseFloat(document.getElementById('contrast').value);
        const ditheringEnabled = document.getElementById('dithering').checked;
        const ditherAlgorithm = document.getElementById('ditherAlgorithm').value;
        const invertEnabled = document.getElementById('invert').checked;
        const ignoreWhite = document.getElementById('ignoreWhite').checked;
        const charset = document.getElementById('charset').value;
        const edgeMethod = document.getElementById('edgeMethod').value;
        const colorMode = document.getElementById('colorMode').value;
        const customColor = document.getElementById('customColorPicker').value;

        // Gradients
        let gradient;
        switch (charset) {
            case 'standard': gradient = "@%#*+=-:."; break;
            case 'blocks': gradient = "█▓▒░ "; break;
            case 'binary': gradient = "01"; break;
            case 'minimal': gradient = "M+-. "; break; // Neo-Swiss minimal
            case 'detailed':
            default: gradient = "$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'."; break;
        }

        const nLevels = gradient.length;
        const contrastFactor = (259 * (contrastValue + 255)) / (255 * (259 - contrastValue));
        const fontAspectRatio = 0.55;
        const asciiHeight = Math.round((img.height / img.width) * asciiWidth * fontAspectRatio);

        // Update global render data for download
        renderedWidth = asciiWidth;
        renderedColors = [];

        // Resize Canvas
        canvas.width = asciiWidth;
        canvas.height = asciiHeight;
        
        // Draw image
        ctx.drawImage(img, 0, 0, asciiWidth, asciiHeight);
        
        const imageData = ctx.getImageData(0, 0, asciiWidth, asciiHeight);
        const data = imageData.data;
        
        // Pre-process: Grayscale & Original Colors
        let gray = [];
        let grayOriginal = []; // For transparency check
        
        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            let lum = 0.299 * r + 0.587 * g + 0.114 * b;
            
            // Invert logic
            if (invertEnabled) {
                lum = 255 - lum;
                if(colorMode === 'image') { r=255-r; g=255-g; b=255-b; }
            }

            // Contrast/Brightness
            let adjusted = clamp(contrastFactor * (lum - 128) + 128 + brightness, 0, 255);
            
            gray.push(adjusted);
            grayOriginal.push(lum); 
            // Save computed color for export
            renderedColors.push({r, g, b});
        }

        // --- Edge Detection Pipeline (If active) ---
        let edgeMap = null;
        if (edgeMethod === 'sobel') {
            const threshold = parseInt(document.getElementById('edgeThreshold').value, 10);
            // Sobel Logic simplified for this version to standard gray
        }
        
        // --- Dithering Pipeline ---
        if (ditheringEnabled && edgeMethod === 'none') {
            if (ditherAlgorithm === 'floyd') {
                for (let y = 0; y < asciiHeight; y++) {
                    for (let x = 0; x < asciiWidth; x++) {
                        const idx = y * asciiWidth + x;
                        const oldPixel = gray[idx];
                        const newPixel = Math.round((oldPixel / 255) * (nLevels - 1)) / (nLevels - 1) * 255;
                        const error = oldPixel - newPixel;
                        gray[idx] = newPixel;
                        if (x + 1 < asciiWidth) gray[idx + 1] += error * 7 / 16;
                        if (y + 1 < asciiHeight) {
                            if (x > 0) gray[idx + asciiWidth - 1] += error * 3 / 16;
                            gray[idx + asciiWidth] += error * 5 / 16;
                            if (x + 1 < asciiWidth) gray[idx + asciiWidth + 1] += error * 1 / 16;
                        }
                    }
                }
            } else if (ditherAlgorithm === 'atkinson') {
                 for (let y = 0; y < asciiHeight; y++) {
                    for (let x = 0; x < asciiWidth; x++) {
                        const idx = y * asciiWidth + x;
                        const oldPixel = gray[idx];
                        const newPixel = Math.round((oldPixel / 255) * (nLevels - 1)) / (nLevels - 1) * 255;
                        const error = oldPixel - newPixel;
                        gray[idx] = newPixel;
                        if (x + 1 < asciiWidth) gray[idx+1] += error/8;
                        if (x + 2 < asciiWidth) gray[idx+2] += error/8;
                        if (y + 1 < asciiHeight) {
                            if (x > 0) gray[idx+asciiWidth-1] += error/8;
                            gray[idx+asciiWidth] += error/8;
                            if (x + 1 < asciiWidth) gray[idx+asciiWidth+1] += error/8;
                        }
                        if (y + 2 < asciiHeight) gray[idx+2*asciiWidth] += error/8;
                    }
                }
            } else if (ditherAlgorithm === 'noise') {
                 for (let i=0; i<gray.length; i++) {
                     const noise = (Math.random() - 0.5) * 40; 
                     gray[i] = clamp(gray[i] + noise, 0, 255);
                 }
            }
        }

        // --- DoG Specifics ---
        let dogMag = null;
        if (edgeMethod === 'dog') {
            let g2d = [];
            for(let y=0; y<asciiHeight; y++) {
                g2d[y] = [];
                for(let x=0; x<asciiWidth; x++) g2d[y][x] = gray[y*asciiWidth + x];
            }
            const dog = differenceOfGaussians2D(g2d, 0.5, 1.0, 3);
            const sob = applySobel2D(dog, asciiWidth, asciiHeight);
            dogMag = nonMaxSuppression(sob.mag, sob.angle, asciiWidth, asciiHeight);
        }
        
        // --- String Building ---
        let htmlOutput = "";
        let textOutput = "";
        const useColor = (colorMode === 'image');
        const customColorVal = (colorMode === 'custom') ? customColor : null;
        const edgeThresh = parseInt(document.getElementById('edgeThreshold').value, 10);

        for (let y = 0; y < asciiHeight; y++) {
            let lineHtml = "";
            let lineText = "";
            
            for (let x = 0; x < asciiWidth; x++) {
                const idx = y * asciiWidth + x;
                let char = "";

                if (edgeMethod === 'dog' && dogMag) {
                    if (dogMag[y][x] * 10 > edgeThresh) { 
                         char = "+"; 
                    } else {
                        char = " ";
                    }
                } else if (edgeMethod === 'sobel') {
                     let val = clamp(gray[idx], 0, 255);
                     let index = Math.floor((val / 255) * (nLevels - 1));
                     char = gradient[index];
                } else {
                    let val = clamp(gray[idx], 0, 255);
                    const rO = data[idx*4], gO = data[idx*4+1], bO = data[idx*4+2];
                    if (ignoreWhite && rO > 250 && gO > 250 && bO > 250) {
                        char = " ";
                    } else {
                        let index = Math.floor((val / 255) * (nLevels - 1));
                        char = gradient[index];
                    }
                }

                lineText += char;
                
                if (useColor) {
                    const c = renderedColors[idx];
                    if (char !== " ") {
                        lineHtml += `<span style="color:rgb(${c.r},${c.g},${c.b})">${char}</span>`;
                    } else {
                        lineHtml += char;
                    }
                } else if (colorMode === 'custom') {
                     if (char !== " ") {
                        lineHtml += `<span style="color:${customColorVal}">${char}</span>`;
                    } else {
                        lineHtml += char;
                    }
                } else {
                    lineHtml += char;
                }
            }
            textOutput += lineText + "\n";
            htmlOutput += lineHtml + "\n";
        }

        if (colorMode === 'mono') {
            outputPre.textContent = textOutput;
        } else {
            outputPre.innerHTML = htmlOutput;
        }

        updateVisuals();
        
        const endTime = performance.now();
        document.getElementById('renderTime').textContent = (endTime - startTime).toFixed(1);
    }

    // ---------------- Visual Updates ----------------
    function updateVisuals() {
        const wrapper = document.getElementById('ascii-art');
        const container = document.getElementById('ascii-wrapper');
        const zoom = document.getElementById('zoom').value;
        const letterSpacing = document.getElementById('letterSpacing').value;
        const lineHeight = document.getElementById('lineHeight').value;
        const fontWeight = document.getElementById('fontWeight').value;
        const bgColor = document.getElementById('bgColorPicker').value;
        
        wrapper.style.fontSize = `${(baseFontSize * zoom) / 100}px`;
        wrapper.style.letterSpacing = `${letterSpacing}px`;
        wrapper.style.lineHeight = lineHeight;
        wrapper.style.fontWeight = fontWeight;
        
        container.style.backgroundColor = bgColor;
        
        document.getElementById('zoomVal').textContent = zoom + '%';
        document.getElementById('letterSpacingVal').textContent = letterSpacing + 'px';
        document.getElementById('lineHeightVal').textContent = lineHeight;
        document.getElementById('fontWeightVal').textContent = fontWeight;
        document.getElementById('asciiWidthVal').textContent = document.getElementById('asciiWidth').value;
        document.getElementById('brightnessVal').textContent = document.getElementById('brightness').value;
        document.getElementById('contrastVal').textContent = document.getElementById('contrast').value;
        document.getElementById('thresholdVal').textContent = document.getElementById('edgeThreshold').value;
    }

    // ---------------- Download ----------------
    function downloadPNG() {
        const pre = document.getElementById('ascii-art');
        // Get raw text (no HTML tags)
        const rawText = pre.innerText || pre.textContent; 
        const lines = rawText.split('\n');
        
        // Remove empty last line if it exists (common with split)
        if (lines.length > 0 && lines[lines.length-1] === '') {
            lines.pop();
        }

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Styles
        const fontSize = parseFloat(pre.style.fontSize || 10);
        const letterSpacing = parseFloat(pre.style.letterSpacing || 0);
        const lineHeightVal = parseFloat(pre.style.lineHeight || 1);
        const lineHeightPx = fontSize * lineHeightVal;
        const fontWeight = pre.style.fontWeight || 400;
        const fontFamily = "JetBrains Mono, monospace";
        
        // High Res Scale
        const scale = 2;
        const fontStr = `${fontWeight} ${fontSize * scale}px ${fontFamily}`;
        
        ctx.font = fontStr;
        
        // Measure Width
        let maxWidth = 0;
        lines.forEach(line => {
             const w = ctx.measureText(line).width + (line.length * letterSpacing * scale);
             if (w > maxWidth) maxWidth = w;
        });
        
        const padding = 40 * scale;
        const w = maxWidth + padding;
        const h = (lines.length * lineHeightPx * scale) + padding;
        
        canvas.width = w;
        canvas.height = h;
        
        // Draw BG
        const bgColor = document.getElementById('bgColorPicker').value;
        ctx.fillStyle = bgColor;
        ctx.fillRect(0,0,w,h);
        
        ctx.font = fontStr;
        ctx.textBaseline = 'top';
        
        const colorMode = document.getElementById('colorMode').value;
        let defaultFill = document.getElementById('customColorPicker').value;
        if (colorMode === 'mono') defaultFill = getComputedStyle(document.body).getPropertyValue('--fg');
        
        // Draw Text
        let y = (padding / 2);
        
        lines.forEach((line, lineIndex) => {
            let x = (padding / 2);
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                // Determine color
                if (colorMode === 'image') {
                    // Map current character back to the original color array
                    // Index = (y * width) + x
                    // Note: lineIndex should match y, i should match x
                    // Safety check for array bounds
                    const colorIdx = (lineIndex * renderedWidth) + i;
                    if (renderedColors[colorIdx]) {
                        const c = renderedColors[colorIdx];
                        ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
                    } else {
                        ctx.fillStyle = defaultFill;
                    }
                } else {
                    ctx.fillStyle = defaultFill;
                }

                ctx.fillText(char, x, y);
                // Advance x with letter spacing
                const charW = ctx.measureText(char).width;
                x += charW + (letterSpacing * scale);
            }
            y += lineHeightPx * scale;
        });
        
        const link = document.createElement('a');
        link.download = 'ascii-art.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // ---------------- Events ----------------
    const inputs = ['asciiWidth', 'brightness', 'contrast', 'dithering', 'ditherAlgorithm', 'invert', 'ignoreWhite', 'charset', 'edgeMethod', 'edgeThreshold', 'colorMode', 'customColorPicker'];
    const visualInputs = ['zoom', 'letterSpacing', 'lineHeight', 'fontWeight', 'bgColorPicker'];

    inputs.forEach(id => {
        const el = document.getElementById(id);
        if(el) el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
            if(currentImage) generateASCII(currentImage);
        });
    });
    
    visualInputs.forEach(id => {
        const el = document.getElementById(id);
        if(el) el.addEventListener('input', updateVisuals);
    });
    
    document.getElementById('edgeMethod').addEventListener('change', (e) => {
        document.getElementById('thresholdControl').style.display = (e.target.value === 'none') ? 'none' : 'flex';
        document.getElementById('dithering').disabled = (e.target.value !== 'none');
    });

    document.getElementById('colorMode').addEventListener('change', (e) => {
        document.getElementById('customColorControl').style.display = (e.target.value === 'custom') ? 'flex' : 'none';
        if(currentImage) generateASCII(currentImage); // re-render needed to switch HTML/Text output
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('asciiWidth').value = 120;
        document.getElementById('brightness').value = 0;
        document.getElementById('contrast').value = 0;
        document.getElementById('letterSpacing').value = 0;
        document.getElementById('lineHeight').value = 1.0;
        document.getElementById('fontWeight').value = 400;
        document.getElementById('zoom').value = 100;
        document.getElementById('colorMode').value = 'mono';
        document.getElementById('bgColorPicker').value = '#080808';
        updateVisuals();
        if(currentImage) generateASCII(currentImage);
    });
    
    document.getElementById('copyBtn').addEventListener('click', () => {
        // Copy logic for rich text vs plain text
        const node = document.getElementById('ascii-art');
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(node);
        selection.removeAllRanges();
        selection.addRange(range);
        document.execCommand('copy');
        selection.removeAllRanges();
        alert("Copied to clipboard");
    });
    
    document.getElementById('downloadBtn').addEventListener('click', downloadPNG);

    document.getElementById('upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                generateASCII(img);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    window.addEventListener('load', function() {
        const defaultImg = new Image();
        defaultImg.crossOrigin = "Anonymous";
        defaultImg.src = "https://images.unsplash.com/photo-1542259682-16781f7d5660?w=500&q=80"; 
        defaultImg.onload = function() {
            currentImage = defaultImg;
            generateASCII(defaultImg);
            updateVisuals();
        };
    });

</script>
